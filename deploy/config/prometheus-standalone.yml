global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - "127.0.0.1:9093"

rule_files:
  - "rules.yml"

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["127.0.0.1:9099"]

  - job_name: "controlplane"
    static_configs:
      - targets: ["127.0.0.1:8080"]
    metrics_path: "/metrics"
    scrape_interval: 5s

  - job_name: "provider"
    static_configs:
      - targets: ["127.0.0.1:9091", "127.0.0.1:9092", "127.0.0.1:9095"]
    metrics_path: "/metrics"
    scrape_interval: 5s
